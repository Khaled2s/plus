<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجواهر - Match 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script>
        // ============================================
        // إعدادات اللعبة الثابتة
        // ============================================
        const CONFIG = {
            WIDTH: 600,
            HEIGHT: 800,
            GRID_COLS: 8,
            GRID_ROWS: 10,
            CELL_SIZE: 60,
            GRID_OFFSET_X: 60,
            GRID_OFFSET_Y: 100,
            BASKET_Y: 720,
            BASKET_WIDTH: 70,
            BASKET_HEIGHT: 40,
            GEM_COLORS: [0xff4444, 0x4444ff, 0x44ff44, 0xffff44, 0xff44ff],
            NEW_ROW_INTERVAL: 8000,
            SCORE_PER_GEM: 10
        };

        CONFIG.GRID_WIDTH = CONFIG.GRID_COLS * CONFIG.CELL_SIZE;
        CONFIG.GRID_HEIGHT = CONFIG.GRID_ROWS * CONFIG.CELL_SIZE;

        // ============================================
        // مشهد اللعبة الرئيسي
        // ============================================
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
            }

            init() {
                this.grid = [];
                this.score = 0;
                this.basketState = 'EMPTY';
                this.heldGemColor = null;
                this.isInputLocked = false;
                this.gameOver = false;
                this.timeUntilNewRow = CONFIG.NEW_ROW_INTERVAL;
                this.gems = this.add.group();
                this.particles = this.add.group();
            }

            create() {
                this.createBackground();
                this.initializeGrid();
                this.createBasket();
                this.createUI();
                this.setupInputs();
                this.startNewRowTimer();
                this.fillInitialGrid();
            }

            createBackground() {
                const gradient = this.add.graphics();
                gradient.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x16213e, 1);
                gradient.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                const gridFrame = this.add.graphics();
                gridFrame.lineStyle(4, 0x4a90d9, 1);
                gridFrame.strokeRoundedRect(
                    CONFIG.GRID_OFFSET_X - 10,
                    CONFIG.GRID_OFFSET_Y - 10,
                    CONFIG.GRID_WIDTH + 20,
                    CONFIG.GRID_HEIGHT + 20,
                    10
                );
                
                const gridLines = this.add.graphics();
                gridLines.lineStyle(1, 0x4a90d9, 0.3);
                
                for (let i = 0; i <= CONFIG.GRID_COLS; i++) {
                    const x = CONFIG.GRID_OFFSET_X + i * CONFIG.CELL_SIZE;
                    gridLines.moveTo(x, CONFIG.GRID_OFFSET_Y);
                    gridLines.lineTo(x, CONFIG.GRID_OFFSET_Y + CONFIG.GRID_HEIGHT);
                }
                
                for (let i = 0; i <= CONFIG.GRID_ROWS; i++) {
                    const y = CONFIG.GRID_OFFSET_Y + i * CONFIG.CELL_SIZE;
                    gridLines.moveTo(CONFIG.GRID_OFFSET_X, y);
                    gridLines.lineTo(CONFIG.GRID_OFFSET_X + CONFIG.GRID_WIDTH, y);
                }
                
                gridLines.strokePath();
            }

            initializeGrid() {
                this.grid = [];
                for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                    this.grid[row] = [];
                    for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                        this.grid[row][col] = 0;
                    }
                }
            }

            createBasket() {
                this.basket = this.add.graphics();
                this.drawBasket(this.basket, CONFIG.WIDTH / 2, CONFIG.BASKET_Y);
                
                this.basketIndicator = this.add.text(
                    CONFIG.WIDTH / 2,
                    CONFIG.BASKET_Y + 50,
                    '← → للتحرك | SPACE للسحب/الإطلاق',
                    {
                        fontSize: '16px',
                        fill: '#ffffff',
                        fontStyle: 'bold'
                    }
                ).setOrigin(0.5);
            }

            drawBasket(graphics, x, y) {
                graphics.clear();
                graphics.fillStyle(0x8b4513, 1);
                graphics.fillRoundedRect(x - CONFIG.BASKET_WIDTH / 2, y - CONFIG.BASKET_HEIGHT / 2, CONFIG.BASKET_WIDTH, CONFIG.BASKET_HEIGHT, 8);
                graphics.lineStyle(3, 0xcd853f, 1);
                graphics.strokeRoundedRect(x - CONFIG.BASKET_WIDTH / 2, y - CONFIG.BASKET_HEIGHT / 2, CONFIG.BASKET_WIDTH, CONFIG.BASKET_HEIGHT, 8);
                graphics.lineStyle(2, 0xa0522d, 0.5);
                for (let i = 0; i < CONFIG.BASKET_WIDTH; i += 10) {
                    graphics.moveTo(x - CONFIG.BASKET_WIDTH / 2 + i, y - CONFIG.BASKET_HEIGHT / 2 + 5);
                    graphics.lineTo(x - CONFIG.BASKET_WIDTH / 2 + i, y + CONFIG.BASKET_HEIGHT / 2 - 5);
                }
                graphics.strokePath();
            }

            createUI() {
                this.scoreText = this.add.text(
                    CONFIG.WIDTH / 2,
                    30,
                    'المحفظة: 0',
                    {
                        fontSize: '28px',
                        fill: '#ffd700',
                        fontStyle: 'bold',
                        stroke: '#000000',
                        strokeThickness: 4
                    }
                ).setOrigin(0.5);
                
                this.timeBarBg = this.add.graphics();
                this.timeBarBg.fillStyle(0x333333, 0.8);
                this.timeBarBg.fillRoundedRect(CONFIG.WIDTH / 2 - 100, 60, 200, 15, 8);
                
                this.timeBar = this.add.graphics();
                this.updateTimeBar();
                
                this.timeText = this.add.text(
                    CONFIG.WIDTH / 2,
                    68,
                    'الصف الجديد خلال: 8.0ث',
                    {
                        fontSize: '14px',
                        fill: '#ffffff',
                        fontStyle: 'bold'
                    }
                ).setOrigin(0.5);
            }

            updateTimeBar() {
                this.timeBar.clear();
                const progress = this.timeUntilNewRow / CONFIG.NEW_ROW_INTERVAL;
                const color = progress > 0.5 ? 0x44ff44 : progress > 0.25 ? 0xffff44 : 0xff4444;
                this.timeBar.fillStyle(color, 1);
                this.timeBar.fillRoundedRect(
                    CONFIG.WIDTH / 2 - 100,
                    60,
                    200 * progress,
                    15,
                    8
                );
            }

            setupInputs() {
                this.cursors = this.input.keyboard.createCursorKeys();
                this.keyA = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
                this.keyD = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
                this.keySpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                this.keyR = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
                
                this.basketSpeed = 400;
                this.basketX = CONFIG.WIDTH / 2;
                
                this.keySpace.on('down', () => this.handleSpacePress(), this);
                
                this.keyR.on('down', () => {
                    if (this.gameOver) {
                        this.scene.restart();
                    }
                });
                
                this.input.on('pointerdown', () => this.handleSpacePress());
            }

            update(time, delta) {
                if (this.gameOver || this.isInputLocked) return;
                
                let moving = false;
                
                if (this.cursors.left.isDown || this.keyA.isDown) {
                    this.basketX -= this.basketSpeed * (delta / 1000);
                    moving = true;
                }
                
                if (this.cursors.right.isDown || this.keyD.isDown) {
                    this.basketX += this.basketSpeed * (delta / 1000);
                    moving = true;
                }
                
                const minX = CONFIG.GRID_OFFSET_X + CONFIG.BASKET_WIDTH / 2;
                const maxX = CONFIG.GRID_OFFSET_X + CONFIG.GRID_WIDTH - CONFIG.BASKET_WIDTH / 2;
                this.basketX = Phaser.Math.Clamp(this.basketX, minX, maxX);
                
                this.basket.setPosition(this.basketX, CONFIG.BASKET_Y);
                this.basket.clear();
                this.drawBasket(this.basket, this.basketX, CONFIG.BASKET_Y);
                
                if (this.basketState === 'HOLDING' && this.heldGemSprite) {
                    this.heldGemSprite.setPosition(this.basketX, CONFIG.BASKET_Y - 30);
                }
                
                if (this.basketState === 'EMPTY') {
                    this.basketIndicator.setText('← → للتحرك | SPACE للسحب');
                } else {
                    this.basketIndicator.setText('← → للتحرك | SPACE للإطلاق');
                }
            }

            handleSpacePress() {
                if (this.gameOver || this.isInputLocked) return;
                
                const col = this.getBasketColumn();
                
                if (this.basketState === 'EMPTY') {
                    this.pullGem(col);
                } else {
                    this.shootGem(col);
                }
            }

            getBasketColumn() {
                const relativeX = this.basketX - CONFIG.GRID_OFFSET_X;
                const col = Math.floor(relativeX / CONFIG.CELL_SIZE);
                return Phaser.Math.Clamp(col, 0, CONFIG.GRID_COLS - 1);
            }

            pullGem(col) {
                let row = -1;
                for (let r = CONFIG.GRID_ROWS - 1; r >= 0; r--) {
                    if (this.grid[r][col] !== 0) {
                        row = r;
                        break;
                    }
                }
                
                if (row === -1) {
                    this.shakeBasket();
                    return;
                }
                
                this.isInputLocked = true;
                const color = this.grid[row][col];
                this.grid[row][col] = 0;
                
                const gemSprite = this.getGemSprite(row, col);
                if (gemSprite) {
                    gemSprite.destroy();
                }
                
                this.heldGemSprite = this.createGemSprite(this.basketX, CONFIG.BASKET_Y - 30, color);
                this.basketState = 'HOLDING';
                this.heldGemColor = color;
                
                setTimeout(() => {
                    this.isInputLocked = false;
                }, 300);
            }

            shootGem(col) {
                let row = -1;
                for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
                    if (this.grid[r][col] === 0) {
                        row = r;
                        break;
                    }
                }
                
                if (row === -1) {
                    this.shakeBasket();
                    return;
                }
                
                this.isInputLocked = true;
                const color = this.heldGemColor;
                
                if (this.heldGemSprite) {
                    this.heldGemSprite.destroy();
                    this.heldGemSprite = null;
                }
                
                this.basketState = 'EMPTY';
                this.heldGemColor = null;
                this.grid[row][col] = color;
                
                const targetX = CONFIG.GRID_OFFSET_X + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const targetY = CONFIG.GRID_OFFSET_Y + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                
                const gemSprite = this.createGemSprite(this.basketX, CONFIG.BASKET_Y - 30, color);
                
                this.tweens.add({
                    targets: gemSprite,
                    x: targetX,
                    y: targetY,
                    duration: 500,
                    ease: 'Power2',
                    onComplete: () => {
                        this.checkMatches(row, col, color);
                    }
                });
            }

            createGemSprite(x, y, color) {
                const texture = this.makeRenderTexture(CONFIG.CELL_SIZE, CONFIG.CELL_SIZE);
                const graphics = this.add.graphics();
                this.drawGem(graphics, CONFIG.CELL_SIZE / 2, CONFIG.CELL_SIZE / 2, CONFIG.CELL_SIZE * 0.8, color);
                texture.draw(graphics);
                texture.refresh();
                graphics.destroy();
                
                const sprite = this.add.image(x, y, texture);
                return sprite;
            }

            drawGem(graphics, x, y, size, color) {
                const halfSize = size / 2;
                
                graphics.fillStyle(0x000000, 0.3);
                graphics.fillCircle(x + 2, y + 2, halfSize);
                
                graphics.fillStyle(color, 1);
                graphics.fillCircle(x, y, halfSize);
                
                graphics.fillStyle(0xffffff, 0.6);
                graphics.fillCircle(x - halfSize * 0.3, y - halfSize * 0.3, halfSize * 0.3);
                
                graphics.lineStyle(2, Phaser.Display.Color.GetColorRGB(color), 0.8);
                graphics.strokeCircle(x, y, halfSize);
            }

            getGemSprite(row, col) {
                const x = CONFIG.GRID_OFFSET_X + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                const y = CONFIG.GRID_OFFSET_Y + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                
                const children = this.children.list;
                for (let child of children) {
                    if (child instanceof Phaser.GameObjects.Image) {
                        const dx = Math.abs(child.x - x);
                        const dy = Math.abs(child.y - y);
                        if (dx < 5 && dy < 5) {
                            return child;
                        }
                    }
                }
                return null;
            }

            checkMatches(row, col, color) {
                const matches = this.findMatches(row, col, color);
                
                if (matches.length >= 3) {
                    this.destroyMatches(matches);
                } else {
                    this.isInputLocked = false;
                }
            }

            findMatches(row, col, color) {
                const matches = new Set();
                matches.add(`${row},${col}`);
                
                let left = col - 1;
                while (left >= 0 && this.grid[row][left] === color) {
                    matches.add(`${row},${left}`);
                    left--;
                }
                
                let right = col + 1;
                while (right < CONFIG.GRID_COLS && this.grid[row][right] === color) {
                    matches.add(`${row},${right}`);
                    right++;
                }
                
                let up = row - 1;
                while (up >= 0 && this.grid[up][col] === color) {
                    matches.add(`${up},${col}`);
                    up--;
                }
                
                let down = row + 1;
                while (down < CONFIG.GRID_ROWS && this.grid[down][col] === color) {
                    matches.add(`${down},${col}`);
                    down++;
                }
                
                return Array.from(matches).map(str => {
                    const [r, c] = str.split(',').map(Number);
                    return { row: r, col: c };
                });
            }

            destroyMatches(matches) {
                this.isInputLocked = true;
                
                const points = matches.length * CONFIG.SCORE_PER_GEM;
                this.score += points;
                this.scoreText.setText(`المحفظة: ${this.score}`);
                
                matches.forEach(({ row, col }) => {
                    const gemSprite = this.getGemSprite(row, col);
                    if (gemSprite) {
                        this.tweens.add({
                            targets: gemSprite,
                            scaleX: 0,
                            scaleY: 0,
                            alpha: 0,
                            duration: 300,
                            ease: 'Back.in',
                            onComplete: () => {
                                gemSprite.destroy();
                            }
                        });
                        
                        this.createExplosion(
                            CONFIG.GRID_OFFSET_X + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                            CONFIG.GRID_OFFSET_Y + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                            this.grid[row][col]
                        );
                    }
                    
                    this.grid[row][col] = 0;
                });
                
                setTimeout(() => {
                    this.applyGravity();
                }, 400);
            }

            applyGravity() {
                for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                    const gems = [];
                    for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                        if (this.grid[row][col] !== 0) {
                            gems.push({ row, color: this.grid[row][col], col });
                            this.grid[row][col] = 0;
                        }
                    }
                    
                    for (let i = 0; i < gems.length; i++) {
                        const newRow = CONFIG.GRID_ROWS - gems.length + i;
                        this.grid[newRow][gems[i].col] = gems[i].color;
                        
                        const gemSprite = this.getGemSprite(gems[i].row, gems[i].col);
                        if (gemSprite) {
                            const targetY = CONFIG.GRID_OFFSET_Y + newRow * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            this.tweens.add({
                                targets: gemSprite,
                                y: targetY,
                                duration: 300,
                                ease: 'Bounce.out'
                            });
                        }
                    }
                }
                
                setTimeout(() => {
                    this.checkChainMatches();
                }, 400);
            }

            checkChainMatches() {
                let hasMatches = false;
                const allMatches = [];
                
                for (let row = 0; row < CONFIG.GRID_ROWS; row++) {
                    for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                        if (this.grid[row][col] !== 0) {
                            const matches = this.findMatches(row, col, this.grid[row][col]);
                            if (matches.length >= 3) {
                                hasMatches = true;
                                matches.forEach(m => {
                                    allMatches.push(`${m.row},${m.col}`);
                                });
                            }
                        }
                    }
                }
                
                if (hasMatches) {
                    const uniqueMatches = [...new Set(allMatches)].map(str => {
                        const [r, c] = str.split(',').map(Number);
                        return { row: r, col: c };
                    });
                    
                    this.destroyMatches(uniqueMatches);
                } else {
                    this.isInputLocked = false;
                }
            }

            createExplosion(x, y, color) {
                const particleKey = 'particle_' + color + '_' + Date.now();
                const graphics = this.make.graphics();
                graphics.fillStyle(color, 1);
                graphics.fillCircle(5, 5, 5);
                graphics.generateTexture(particleKey, 10, 10);
                graphics.destroy();
                
                const particles = this.add.particles(x, y, particleKey, {
                    speed: { min: 50, max: 150 },
                    angle: { min: 0, max: 360 },
                    scale: { start: 0.5, end: 0 },
                    lifespan: 500,
                    quantity: 10,
                    blendMode: 'ADD'
                });
                
                setTimeout(() => {
                    particles.destroy();
                    if (this.textures.exists(particleKey)) {
                        this.textures.remove(particleKey);
                    }
                }, 500);
            }

            shakeBasket() {
                this.tweens.add({
                    targets: this.basket,
                    x: this.basketX + 10,
                    duration: 50,
                    yoyo: true,
                    repeat: 3
                });
            }

            startNewRowTimer() {
                this.newRowEvent = this.time.addEvent({
                    delay: 100,
                    callback: this.updateNewRowTimer,
                    callbackScope: this,
                    loop: true
                });
            }

            updateNewRowTimer() {
                if (this.gameOver || this.isInputLocked) return;
                
                this.timeUntilNewRow -= 100;
                
                if (this.timeUntilNewRow <= 0) {
                    this.addNewRow();
                    this.timeUntilNewRow = CONFIG.NEW_ROW_INTERVAL;
                }
                
                this.updateTimeBar();
                this.timeText.setText(`الصف الجديد خلال: ${(this.timeUntilNewRow / 1000).toFixed(1)}ث`);
            }

            addNewRow() {
                this.isInputLocked = true;
                
                for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                    if (this.grid[CONFIG.GRID_ROWS - 1][col] !== 0) {
                        this.triggerGameOver();
                        return;
                    }
                }
                
                const newRow = this.generateSafeRow();
                
                for (let row = CONFIG.GRID_ROWS - 1; row > 0; row--) {
                    for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                        this.grid[row][col] = this.grid[row - 1][col];
                        
                        const gemSprite = this.getGemSprite(row - 1, col);
                        if (gemSprite) {
                            const targetY = CONFIG.GRID_OFFSET_Y + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                            this.tweens.add({
                                targets: gemSprite,
                                y: targetY,
                                duration: 500,
                                ease: 'Power2'
                            });
                        }
                    }
                }
                
                for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                    this.grid[0][col] = newRow[col];
                    
                    const x = CONFIG.GRID_OFFSET_X + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const y = CONFIG.GRID_OFFSET_Y - CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                    const gemSprite = this.createGemSprite(x, y, newRow[col]);
                    
                    this.tweens.add({
                        targets: gemSprite,
                        y: CONFIG.GRID_OFFSET_Y + CONFIG.CELL_SIZE / 2,
                        duration: 500,
                        ease: 'Power2',
                        onComplete: () => {
                            this.checkMatches(0, col, newRow[col]);
                        }
                    });
                }
                
                setTimeout(() => {
                    this.isInputLocked = false;
                }, 600);
            }

            generateSafeRow() {
                const row = [];
                
                for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                    let color;
                    let attempts = 0;
                    
                    do {
                        color = Phaser.Math.Between(1, 5);
                        attempts++;
                        
                        if (col >= 2 && row[col - 1] === color && row[col - 2] === color) {
                            continue;
                        }
                        
                        break;
                    } while (attempts < 10);
                    
                    row[col] = color;
                }
                
                return row;
            }

            fillInitialGrid() {
                this.isInputLocked = true;
                
                for (let row = 0; row < CONFIG.GRID_ROWS / 2; row++) {
                    for (let col = 0; col < CONFIG.GRID_COLS; col++) {
                        const color = Phaser.Math.Between(1, 5);
                        this.grid[row][col] = color;
                        
                        const x = CONFIG.GRID_OFFSET_X + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        const y = CONFIG.GRID_OFFSET_Y + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
                        
                        this.createGemSprite(x, y, color);
                    }
                }
                
                setTimeout(() => {
                    this.isInputLocked = false;
                }, 500);
            }

            triggerGameOver() {
                this.gameOver = true;
                this.newRowEvent.remove();
                
                const overlay = this.add.rectangle(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT, 0x000000, 0.8);
                overlay.setOrigin(0);
                
                this.add.text(
                    CONFIG.WIDTH / 2,
                    CONFIG.HEIGHT / 2 - 50,
                    'انتهت اللعبة!',
                    {
                        fontSize: '48px',
                        fill: '#ff4444',
                        fontStyle: 'bold',
                        stroke: '#ffffff',
                        strokeThickness: 6
                    }
                ).setOrigin(0.5);
                
                this.add.text(
                    CONFIG.WIDTH / 2,
                    CONFIG.HEIGHT / 2 + 20,
                    `النقاط النهائية: ${this.score}`,
                    {
                        fontSize: '32px',
                        fill: '#ffd700',
                        fontStyle: 'bold'
                    }
                ).setOrigin(0.5);
                
                const restartBtn = this.add.text(
                    CONFIG.WIDTH / 2,
                    CONFIG.HEIGHT / 2 + 100,
                    'اضغط R لإعادة اللعب',
                    {
                        fontSize: '24px',
                        fill: '#ffffff',
                        fontStyle: 'bold',
                        backgroundColor: '#4a90d9',
                        padding: { x: 20, y: 10 }
                    }
                ).setOrigin(0.5);
                
                this.tweens.add({
                    targets: restartBtn,
                    scaleX: 1.1,
                    scaleY: 1.1,
                    duration: 500,
                    yoyo: true,
                    repeat: -1
                });
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: CONFIG.WIDTH,
            height: CONFIG.HEIGHT,
            parent: 'game-container',
            backgroundColor: '#1a1a2e',
            scene: GameScene,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            }
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
